<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돌이킬 수 없는</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0908'/%3E%3Crect x='7' y='5' width='18' height='22' fill='%23d9d2c2'/%3E%3Cpath d='M10 10h12M10 14h12M10 18h8' stroke='%237d1f1a' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <filter id="rough" x="-12%" y="-25%" width="124%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.09" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="torn" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="4" seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="gnaw" x="-20%" y="-40%" width="140%" height="180%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.14" numOctaves="2" seed="3" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<!-- ── 현관 ───────────────────────────────────────────────── -->
<section id="lobby" class="screen active">
  <div class="lobby-inner">
    <h1 class="title">돌이킬 수 없는</h1>
    <p class="subtitle">눈을 떠 보니 낯선 공간이다.<br>바닥에 공책 한 권이 놓여 있다.</p>

    <div class="lobby-actions">
      <button id="btn-read" class="btn">공책을 읽는다</button>
      <button id="btn-enter" class="btn btn-primary">안으로 들어간다</button>
    </div>

    <p id="lobby-note" class="subtitle"></p>
    <div id="auth-box" class="auth-box"></div>
  </div>
</section>

<!-- ── 방명록 ─────────────────────────────────────────────── -->
<section id="guestbook" class="screen">
  <div class="book">
    <header class="book-head">
      <h2>방명록</h2>
      <button id="btn-close-book" class="btn btn-ghost">덮는다</button>
    </header>

    <div id="entries" class="entries"></div>

    <div id="write-box" class="write-box hidden">
      <p class="write-hint">
        당신은 이곳을 빠져나왔다. 출구 쪽 공책에 한 줄을 남길 수 있다.
      </p>
      <textarea id="write-text" maxlength="500" rows="3"></textarea>
      <div class="write-actions">
        <span id="write-count" class="count">0 / 500</span>
        <button id="btn-submit" class="btn btn-primary">적는다</button>
      </div>
      <div id="write-result" class="write-result hidden"></div>
    </div>

  </div>
</section>

<!-- ── 게임 ───────────────────────────────────────────────── -->
<section id="game" class="screen">
  <canvas id="view"></canvas>
  <canvas id="minimap"></canvas>

  <div id="hud" class="hud">
    <span id="hud-hp"></span>
    <span id="hud-gear"></span>
    <span id="hud-turns"></span>
  </div>

  <button id="btn-quit" class="quit">그만둔다</button>

  <div class="panel">
    <div id="log" class="log"></div>
    <div id="choices" class="choices"></div>
  </div>

  <div id="ending" class="overlay hidden">
    <div class="overlay-card">
      <h3 id="ending-title"></h3>
      <p id="ending-text" class="dim"></p>
      <button id="btn-ending" class="btn btn-primary"></button>
    </div>
  </div>
</section>

<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="/ui.js"></script>
</body>
</html>
